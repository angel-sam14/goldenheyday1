
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Golden Heyday Caterers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="main-nav">

    <a href="index.html" class="logo">
        <span class="logo-icon">✦</span>
        <span>
            <strong>GOLDEN HEYDAY</strong>
            <small>CATERERS</small>
        </span>
    </a>

    <button class="menu-toggle" onclick="toggleMenu()">☰</button>

    <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="menu.html">Menu</a>
        <a href="contact.html">Contact</a>
        <a href="enquiry.html" class="nav-enquiry">Enquiry</a>
    </div>

</nav>

<section class="enquiry-section">

    <div class="page-heading">
        <h1>Make an Enquiry</h1>
        <p>Tell us about your upcoming event</p>
    </div>

    <div class="enquiry-container">

        <form class="enquiry-form" id="enquiryForm">

            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name"
                       placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel"
                       id="phone"
                       placeholder="Enter 10-digit phone number"
                       minlength="10"
                       maxlength="10"
                       pattern="[0-9]{10}"
                       inputmode="numeric"
                       required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter email address">
            </div>

            <div class="form-group">
                <label for="event">Event Type</label>
                <select id="event" required>
                    <option value="">Select event type</option>
                    <option>Wedding</option>
                    <option>Engagement</option>
                    <option>Birthday / Private Party</option>
                    <option>Corporate Event</option>
                    <option>Traditional Kerala Catering</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Event Date</label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label for="location">Event Location</label>
                <input type="text" id="location"
                       placeholder="Enter event location" required>
            </div>

            <div class="form-group">
                <label for="guests">Expected Number of Guests</label>
                <input type="number" id="guests"
                       min="1" placeholder="Number of guests" required>
            </div>

            <div class="form-group full-width">
                <label for="message">Additional Details</label>
                <textarea id="message" rows="5"
                          placeholder="Tell us about your requirements"></textarea>
            </div>

            <button type="submit" class="enquiry-button">
                Submit Enquiry
            </button>

        </form>

    </div>

</section>

<footer>
    <p>© 2026 Golden Heyday Caterers. All Rights Reserved.</p>
</footer>

<script>

    function toggleMenu() {
        document.getElementById("navLinks").classList.toggle("active");
    }

    const phoneInput = document.getElementById("phone");

    // Allow only 10 digits
    phoneInput.addEventListener("input", function() {
        this.value = this.value.replace(/[^0-9]/g, "").slice(0, 10);
    });

    // Set today's date as minimum date
    const dateInput = document.getElementById("date");
    const today = new Date();
    const localDate = new Date(
        today.getTime() - today.getTimezoneOffset() * 60000
    ).toISOString().split("T")[0];

    dateInput.min = localDate;

    // Form validation
    document.getElementById("enquiryForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const phone = phoneInput.value.trim();
        const guests = document.getElementById("guests").value;
        const eventDate = dateInput.value;

        if (name.length < 3) {
            alert("Please enter a valid name.");
            return;
        }

        if (!/^[0-9]{10}$/.test(phone)) {
            alert("Phone number must contain exactly 10 digits.");
            phoneInput.focus();
            return;
        }

        if (Number(guests) < 1) {
            alert("Number of guests must be at least 1.");
            return;
        }

        if (!eventDate || eventDate < localDate) {
            alert("Please select a valid event date.");
            return;
        }

        alert("Thank you! Your enquiry form is valid.");

        this.reset();
    });

</script>

</body>
</html>
